# ADR-008 / Z-2: the release workflow on this fork (see also test.yml, which
# runs the binary's tests on PRs — same self-hosted runner, no hosted minutes).
# Replaces upstream's GitHub-hosted docs/release/build-and-test workflows
# (deleted — they would burn GitHub-hosted minutes). Builds the release binary
# on the org's self-hosted tailnet runner (the NixOS box) and attaches it to the
# GitHub Release for the tag. Runs only on version tags.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, tailnet]
    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        run: nix shell nixpkgs#cargo nixpkgs#rustc nixpkgs#gcc -c cargo build --release --bin zola

      - name: Attach binary to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            target/release/zola \
            --target "$GITHUB_SHA" \
            --generate-notes
